[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awf"
version = "0.1.0"
description = "Agentic Workflow Fabric core"
requires-python = ">=3.12,<3.15"
dependencies = ["PyYAML>=6", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
awf-setup = "awf.setup:main"
awf-secret = "awf.secrets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
