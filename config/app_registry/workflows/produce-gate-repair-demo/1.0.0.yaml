apiVersion: awf/v1
kind: Workflow
metadata:
  name: produce-gate-repair-demo
  version: 1.0.0
  digest: "887e7ff8510184b8f07a811f6764ac05d04b7e17cd9441483521b4b323e6c0ee"
spec:
  inputSchema:
    type: object
    properties:
      objective:
        type: string
    required: [objective]
  outputSchema:
    type: object
    properties:
      repairs_used:
        type: integer
  budgets:
    maxRepairIterations: 3
  nodes:
    - id: produce
      type: agent
      adapter: claude-code
      objective: "Create a file named calc.py containing a function add(a, b) that returns a - b (an intentional bug: it should return a + b)."
      next: check
    - id: check
      type: gate
      check: calc_add_returns_sum
      checkCommand: "python3.12 -c \"import calc; assert calc.add(2, 3) == 5\""
      next: null
      onFail: repair
    - id: repair
      type: agent
      adapter: codex
      objective: "Fix calc.py: the add(a, b) function must return a + b, not a - b. Do not change anything else."
      next: check
  outputs:
    repairs_used: "{{ engine.repairs_used }}"
