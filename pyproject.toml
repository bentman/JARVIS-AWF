[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awf"
version = "0.1.0"
description = "Agentic Workflow Fabric core"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PyYAML>=6",
  "cryptography>=42,<=46.0.3",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "onnx>=1.22", "ruff>=0.15.22"]
model-gateway = ["litellm>=1.91.5,<1.92"]
speech = [
  "faster-whisper>=1.2; sys_platform!='win32' or platform_machine!='ARM64'",
  "kokoro-onnx>=0.5",
  "huggingface-hub>=0.22",
  "onnx-asr>=0.8",
  "sherpa-onnx>=1.13.5",
  "numpy>=1.26,<3",
]
wake-word = [
  "openwakeword==0.6.0",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "scipy>=1.11",
]
hw-ort-cpu = ["onnxruntime>=1.28"]
hw-ort-cuda = ["onnxruntime-gpu>=1.28"]
hw-ort-directml = ["onnxruntime-directml>=1.28; sys_platform=='win32'"]
hw-ort-qnn = [
  "onnxruntime>=1.28; ((platform_machine=='ARM64' or platform_machine=='arm64') and sys_platform=='win32') or ((platform_machine=='aarch64' or platform_machine=='arm64') and sys_platform=='linux')",
  "onnxruntime-qnn>=2.3; ((platform_machine=='ARM64' or platform_machine=='arm64') and sys_platform=='win32') or ((platform_machine=='aarch64' or platform_machine=='arm64') and sys_platform=='linux')",
  "onnx>=1.16; ((platform_machine=='ARM64' or platform_machine=='arm64') and sys_platform=='win32') or ((platform_machine=='aarch64' or platform_machine=='arm64') and sys_platform=='linux')",
  "transformers>=4.40; ((platform_machine=='ARM64' or platform_machine=='arm64') and sys_platform=='win32') or ((platform_machine=='aarch64' or platform_machine=='arm64') and sys_platform=='linux')",
]

[project.scripts]
awf-setup = "awf.setup:main"
awf-secret = "awf.secrets.cli:main"
awf = "awf.cli.main:main"
awf-speech = "awf.speech.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend/src", "backend/tests", "scripts"]
exclude = ["cache", "data", "models", "runtimes", "reports", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "live: requires live external resources",
  "slow: longer-running test",
  "runtime: runtime or environment validation",
]
