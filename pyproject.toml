[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awf"
version = "0.1.0"
description = "Agentic Workflow Fabric core"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PyYAML>=6",
  "cryptography>=42",
  "litellm>=1.94",
  "onnxruntime>=1.28",
  "onnx>=1.22",
  "openwakeword>=0.4",
  "faster-whisper>=1.2",
  "kokoro-onnx>=0.5",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
awf-setup = "awf.setup:main"
awf-secret = "awf.secrets.cli:main"
awf = "awf.cli.main:main"
awf-speech = "awf.speech.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "live: requires live external resources",
  "slow: longer-running test",
  "runtime: runtime or environment validation",
]
