[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awf"
version = "0.1.0"
description = "Agentic Workflow Fabric core"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PyYAML>=6",
  "cryptography>=42",
  "litellm>=1.94",
  "openwakeword>=0.4",
  "faster-whisper>=1.2",
  "kokoro-onnx>=0.5",
  "silero-vad>=6",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "onnx>=1.22"]
hw-ort-cpu = ["onnxruntime>=1.28"]
hw-ort-cuda = ["onnxruntime-gpu>=1.28"]
hw-ort-directml = ["onnxruntime-directml>=1.28; sys_platform=='win32'"]
hw-ort-qnn = [
  "onnxruntime>=1.28; platform_machine=='ARM64' and sys_platform=='win32'",
  "onnxruntime-qnn>=2.3; platform_machine=='ARM64' and sys_platform=='win32'",
]

[project.scripts]
awf-setup = "awf.setup:main"
awf-secret = "awf.secrets.cli:main"
awf = "awf.cli.main:main"
awf-speech = "awf.speech.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "live: requires live external resources",
  "slow: longer-running test",
  "runtime: runtime or environment validation",
]
